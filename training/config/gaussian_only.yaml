defaults:
  - default
  - _self_

exp_name: gaussian_only

logging:
  log_dir: outputs

checkpoint:
  save_dir: ${logging.log_dir}/${exp_name}/ckpts
  init_checkpoint_path: checkpoints/model.pt
  resume_checkpoint_path: null
  strict: False

loss:
  point_loss_weight: 0.0
  camera_loss_weight: 0.0
  gaussian_loss_weight: 1.0

model:
  enable_camera: False
  enable_depth: False
  enable_point: False
  enable_global_points: False
  enable_3dgs: True

optim:
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1.5e-4
    weight_decay: 0.02
    betas: [0.9, 0.95]

  options:
    lr:
      - param_names:
          - gaussian_decoder.*
        scheduler:
          _target_: train_utils.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: train_utils.param_scheduler.LinearParamScheduler
              start_value: 5e-7
              end_value: 3.0e-5
            - _target_: train_utils.param_scheduler.CosineParamScheduler
              start_value: 3.0e-5
              end_value: 1e-6
          lengths: [0.10, 0.90]
          interval_scaling: ["rescaled", "rescaled"]
      - param_names:
          - gaussian_stage1_head.*
          - gaussian_param_head.trunk.*
          - gaussian_param_head.mean_head.*
          - gaussian_param_head.log_scale_head.*
          - gaussian_param_head.rotation_head.*
          - gaussian_param_head.opacity_head.*
          - gaussian_param_head.sh_head.*
          - gaussian_param_head.offset_head.*
          - gaussian_param_head.child_log_scale_head.*
          - gaussian_param_head.child_rotation_head.*
          - gaussian_param_head.child_opacity_head.*
          - gaussian_param_head.child_sh_head.*
        scheduler:
          _target_: train_utils.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: train_utils.param_scheduler.LinearParamScheduler
              start_value: 1e-6
              end_value: 5.0e-5
            - _target_: train_utils.param_scheduler.CosineParamScheduler
              start_value: 5.0e-5
              end_value: 2e-6
          lengths: [0.10, 0.90]
          interval_scaling: ["rescaled", "rescaled"]
      - param_names:
          - gaussian_param_head.mean_anchor_head.*
          - gaussian_param_head.child_anchor_offset_head.*
        scheduler:
          _target_: train_utils.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: train_utils.param_scheduler.LinearParamScheduler
              start_value: 5e-7
              end_value: 2.0e-5
            - _target_: train_utils.param_scheduler.CosineParamScheduler
              start_value: 2.0e-5
              end_value: 1e-6
          lengths: [0.10, 0.90]
          interval_scaling: ["rescaled", "rescaled"]
      - param_names:
          - pos_adapters.gaussian.*
        scheduler:
          _target_: train_utils.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: train_utils.param_scheduler.LinearParamScheduler
              start_value: 5e-7
              end_value: 1e-5
            - _target_: train_utils.param_scheduler.CosineParamScheduler
              start_value: 1e-5
              end_value: 5e-7
          lengths: [0.10, 0.90]
          interval_scaling: ["rescaled", "rescaled"]
    weight_decay:
      - param_names:
          - "*.bias"
          - "*.norm*.weight"
          - "*ln.weight"
        scheduler:
          _target_: train_utils.param_scheduler.ConstantParamScheduler
          value: 0.0
      - scheduler:
          _target_: train_utils.param_scheduler.ConstantParamScheduler
          value: 0.02

  frozen_module_names:
    - aggregator
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["gaussian_decoder", "gaussian_stage1_head", "gaussian_param_head.trunk", "gaussian_param_head.mean_head", "gaussian_param_head.log_scale_head", "gaussian_param_head.rotation_head", "gaussian_param_head.opacity_head", "gaussian_param_head.sh_head", "gaussian_param_head.offset_head", "gaussian_param_head.child_log_scale_head", "gaussian_param_head.child_rotation_head", "gaussian_param_head.child_opacity_head", "gaussian_param_head.child_sh_head"]
        max_norm: 2.0
        norm_type: 2
      - module_name: ["gaussian_param_head.mean_anchor_head", "gaussian_param_head.child_anchor_offset_head"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["pos_adapters.gaussian"]
        max_norm: 0.2
        norm_type: 2

distributed:
  find_unused_parameters: False
