defaults:
  - gaussian_only
  - _self_

exp_name: panocity_gaussian
num_workers: 4
max_img_per_gpu: 48
max_img_per_gpu_val: 48
val_epoch_freq: 1

logging:
  log_dir: /home/featurize/PanoVGGT/outputs

checkpoint:
  save_dir: ${logging.log_dir}/${exp_name}/ckpts
  init_checkpoint_path: /home/featurize/PanoVGGT/checkpoints/model.pt
  save_freq: 1

loss:
  gaussian_render:
    weight: 0.45
    rgb_weight: 1.5
    depth_weight: 0.04
    alpha_weight: 0.55
    opacity_floor: 1e-3
    sh_warmup_start: 0.0
    sh_warmup_end: 0.35
    weight_warmup_start: 0.10
    weight_warmup_end: 0.45
  gaussian_supervision:
    center_weight: 0.85
    scale_weight: 0.45
    rotation_weight: 0.02
    opacity_weight: 0.35
    opacity_target_min: 0.88
    opacity_target_max: 0.99
    keep_weight: 0.02
    split_weight: 0.08
    sh_weight: 0.35
    sh_rest_reg_weight: 0.02
    sh_rest_warmup_start: 0.0
    sh_rest_warmup_end: 0.35
    ray_weight: 0.35
    ray_behind_weight: 0.25
    offset_reg_weight: 0.16
    scale_target_min: 0.004
    scale_target_max: 0.035
    scale_target_angular_factor: 0.30
    scale_under_weight: 0.75
    scale_over_weight: 4.0
    scale_floor_weight: 0.0
    opacity_floor_weight: 0.25
    split_detail_thresholds: [0.30, 0.55, 0.78]
    keep_importance_threshold: 0.0

model:
  gaussian_head:
    soft_split_training: False
    log_scale_min: -7.0
    log_scale_max: -3.0
    max_child_offset: 0.12
    mean_anchor_scale: 1.0
    max_mean_residual: 0.06
    child_anchor_scale: 1.0

data:
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.panocity.PanoCityDataset
          split: train
          PanoCity_DIR: /home/featurize/PanoCity
          splits_config_file: /home/featurize/PanoVGGT/outputs/panocity_splits/splits_config.json
          cache_dir: /home/featurize/PanoVGGT/outputs/panocity_cache
          len_train: 4000
          get_nearby: True

  val:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu_val}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.panocity.PanoCityDataset
          split: test
          PanoCity_DIR: /home/featurize/PanoCity
          splits_config_file: /home/featurize/PanoVGGT/outputs/panocity_splits/splits_config.json
          cache_dir: /home/featurize/PanoVGGT/outputs/panocity_cache
          len_test: 256
