# @package _global_
# Stage 2: refine GS color, opacity, scale, and offset.
# PanoVGGT backbone/depth/camera/global-point modules stay frozen.

defaults:
  - /gs/local
  - _self_

exp_name: gs_stage2_refine
max_epochs: 260
limit_train_batches: 300
limit_val_batches: 50

loss:
  gs:
    self_recon: False
    rgb_loss_type: charbonnier
    charbonnier_eps: 0.001
    solid_angle_weight: True
    ssim_weight: 0.001
    depth_weight: 0.0
    scale_init_factor: 0.5
    scale_mult_min: 0.25
    scale_mult_max: 1.25
    scale_reg_weight: 0.005
    scale_reg_target: 1.0
    offset_max_ratio: 0.35
    use_offset: True
    train_dc: True
    train_opacity: True
    train_scale: True
    train_rotation: False
    train_sh_rest: False
    rotation_init_mode: tangent

optim:
  frozen_module_names:
    - aggregator
    - point_decoder
    - point_head
    - camera_decoder
    - camera_head
    - global_points_decoder
    - global_point_head
    - pos_adapters
    - gaussian_head.rotation
    - gaussian_head.sh_rest
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-6
    weight_decay: 0.0
  options:
    lr:
      - param_names:
          - module.gaussian_head.scale.*
        scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 2e-7
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 1e-6
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.0

checkpoint:
  save_dir: ./outputs/${exp_name}/ckpts
  save_freq: 5
  resume_checkpoint_path: null
  # resume_checkpoint_path: ./outputs/gs_stage2_refine/ckpts/checkpoint.pt
  init_checkpoint_path: ./outputs/gs_stage1_bootstrap/ckpts/checkpoint.pt
  strict: False

logging:
  log_dir: ./outputs/${exp_name}
  log_exp: ${exp_name}
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ./outputs/tensorboard/${exp_name}
