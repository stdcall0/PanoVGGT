# @package _global_
# Local GS-head stage-2 refinement config.
# Four datasets: Stanford2D3DS + Structured3D + PanoCity + Matterport3D.
# Stage-2 resumes from stage-1 model weights and refines GS color, opacity, scale, and offset only.

defaults:
  - /default
  - _self_

exp_name: gs_local_stage2

max_epochs: 80
accum_steps: 1
max_img_per_gpu: 16
max_img_per_gpu_val: 8
limit_train_batches: 300
limit_val_batches: 50

model:
  enable_global_points: True
  enable_gaussian: True
  gs_sh_degree: 1
  gs_scale_init: 0.01
  gs_opacity_init: 0.1

loss:
  _target_: panovggt.models.loss.Loss
  train_conf: ${model.train_conf}
  gs:
    enabled: True
    photometric_mode: source_recon
    self_recon: True
    mask_rgb_by_valid: False
    renderer: cube
    face_res: 256
    fov_deg: 95.0
    boundary_px: 4
    scale_init_mode: depth_footprint
    scale_init_value: 0.01
    min_valid_ratio: 0.25
    use_offset: True
    detach_centers: True
    detach_camera: True
    train_dc: True
    train_opacity: True
    train_scale: True
    train_rotation: False
    train_sh_rest: False
    rgb_weight: 1.0
    ssim_weight: 0.0
    depth_weight: 0.0
    loss_weight: 1.0
    point_loss_weight: 0.0
    camera_loss_weight: 0.0

optim:
  frozen_module_names:
    - aggregator
    - point_decoder
    - point_head
    - camera_decoder
    - camera_head
    - global_points_decoder
    - global_point_head
    - pos_adapters
    - gaussian_head.rotation
    - gaussian_head.sh_rest
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-6
    weight_decay: 0.0
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 1e-6
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.0
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: [gaussian]
        max_norm: 1.0
        norm_type: 2

checkpoint:
  save_dir: ./outputs/${exp_name}/ckpts
  save_freq: 5
  resume_checkpoint_path: ./outputs/gs_local/ckpts/stage1_model_only.pt
  strict: False

logging:
  log_dir: ./outputs/${exp_name}
  log_exp: ${exp_name}
  log_visuals: False
  log_freq: 1
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: True
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ./outputs/tensorboard/${exp_name}
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_gs
        - loss_gs_rgb
        - loss_gs_ssim
        - loss_gs_depth
        - loss_gs_scale_reg
        - loss_gs_coverage
        - loss_gs_front_floater
        - loss_gs_offset_reg
    val:
      keys_to_log:
        - loss_objective
        - loss_gs
        - loss_gs_rgb
        - loss_gs_ssim
        - loss_gs_depth
        - loss_gs_scale_reg
        - loss_gs_coverage
        - loss_gs_front_floater
        - loss_gs_offset_reg

data:
  train:
    common_config:
      img_nums: [2, 4]
      allow_duplicate_img: False
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.stanford2d3ds.Stanford2D3DSDataset
          split: train
          Stanford2D3DS_DIR: ../dataset/Stanford2D3DS
          len_train: 2400
          get_nearby: False
        - _target_: data.datasets.structured3d.Structured3DDataset
          split: train
          Structured3D_DIR: ../dataset/Structured3D/Structured3D
          len_train: 2400
          get_nearby: False
        - _target_: data.datasets.panocity.PanoCityDataset
          split: train
          PanoCity_DIR: ../dataset/PanoCity
          len_train: 16800
          get_nearby: True
        - _target_: data.datasets.matterport3d.Matterport3DDataset
          split: train
          Matterport3D_DIR: ../dataset/Matterport3D/processed
          len_train: 4800
          get_nearby: False
  val:
    common_config:
      inside_random: False
      fix_img_num: 4
      fix_aspect_ratio: 1.0
      img_nums: [4, 4]
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.stanford2d3ds.Stanford2D3DSDataset
          split: test
          Stanford2D3DS_DIR: ../dataset/Stanford2D3DS
          len_test: 240
        - _target_: data.datasets.structured3d.Structured3DDataset
          split: test
          Structured3D_DIR: ../dataset/Structured3D/Structured3D
          len_test: 1400
        - _target_: data.datasets.panocity.PanoCityDataset
          split: test
          PanoCity_DIR: ../dataset/PanoCity
          len_test: 2400
        - _target_: data.datasets.matterport3d.Matterport3DDataset
          split: test
          Matterport3D_DIR: ../dataset/Matterport3D/processed
          len_test: 480
