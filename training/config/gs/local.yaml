# @package _global_
# Stage D — local 8x H200 run.
# Trains ONLY the Gaussian head; the rest of the model (aggregator + heads)
# is loaded from checkpoints/model.pt and frozen.
# Datasets are read from ./dataset (Matterport3D excluded — not ready locally).

defaults:
  - /default
  - _self_

exp_name: gs_stage_d_local

# ---- model: enable GS branch (full Stage D config) -------------------------
model:
  enable_global_points: True
  enable_gaussian: True
  gs_sh_degree: 1
  gs_scale_init: 0.01
  gs_opacity_init: 0.1


# ---- loss: Stage D GS render loss ------------------------------------------
loss:
  _target_: panovggt.models.loss.Loss
  train_conf: ${model.train_conf}
  gs:
    enabled: True
    renderer: cube
    face_res: 512
    fov_deg: 95.0
    boundary_px: 4
    scale_init_mode: depth_footprint
    scale_init_value: 0.01
    use_offset: True
    detach_centers: True       # backbone is frozen, no gradient flow back
    detach_camera: True
    train_dc: True
    train_opacity: True
    train_scale: True
    train_rotation: True
    train_sh_rest: True
    rgb_weight: 1.0
    ssim_weight: 0.2
    depth_weight: 0.05
    loss_weight: 1.0
    point_loss_weight: 0.0     # backbone frozen; skip ancillary losses
    camera_loss_weight: 0.0


# ---- optim: freeze ALL non-GS modules --------------------------------------
optim:
  frozen_module_names:
    - "aggregator"
    - "point_decoder"
    - "point_head"
    - "camera_decoder"
    - "camera_head"
    - "global_points_decoder"
    - "global_point_head"
    - "pos_adapters"
  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-6
    weight_decay: 0.05
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["gaussian"]
        max_norm: 1.0
        norm_type: 2


# ---- checkpointing: warm-start non-GS weights from base model.pt -----------
# resume_checkpoint_path is null in config; the launcher script overrides it
# to ./checkpoints/model.pt on the first run, then lets get_resume_checkpoint()
# auto-resume from save_dir/checkpoint.pt on subsequent loop iterations.
checkpoint:
  save_dir: ./outputs/gs_stage_d_local/ckpts
  save_freq: 5
  resume_checkpoint_path: null
  strict: False


# ---- logging: local paths --------------------------------------------------
logging:
  log_dir: ./outputs/gs_stage_d_local
  log_exp: ${exp_name}
  log_visuals: False
  log_freq: 1
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: True
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ./outputs/tensorboard/${exp_name}
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_gs
        - loss_gs_rgb
        - loss_gs_ssim
        - loss_gs_depth
    val:
      keys_to_log:
        - loss_objective
        - loss_gs
        - loss_gs_rgb
        - loss_gs_ssim
        - loss_gs_depth


# ---- datasets: local ./dataset paths ---------------------------------------
# Matterport3D scene parsing is in progress; the loader will skip any scene in
# train.txt that doesn't yet have a parsed_json entry, so it's safe to enable.
# If new scenes are processed later, delete
# ./dataset/Matterport3D/processed/cache/matterport3d_*_index.json before launch
# so the index is rebuilt.
data:
  train:
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.stanford2d3ds.Stanford2D3DSDataset
          split: train
          Stanford2D3DS_DIR: ./dataset/Stanford2D3DS
          len_train: 2400
          get_nearby: False
        - _target_: data.datasets.structured3d.Structured3DDataset
          split: train
          Structured3D_DIR: ./dataset/Structured3D/Structured3D
          len_train: 2400
          get_nearby: False
        - _target_: data.datasets.panocity.PanoCityDataset
          split: train
          PanoCity_DIR: ./dataset/PanoCity
          len_train: 16800
          get_nearby: True
        - _target_: data.datasets.matterport3d.Matterport3DDataset
          split: train
          Matterport3D_DIR: ./dataset/Matterport3D/processed
          len_train: 4800
  val:
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.stanford2d3ds.Stanford2D3DSDataset
          split: test
          Stanford2D3DS_DIR: ./dataset/Stanford2D3DS
          len_test: 240
        - _target_: data.datasets.structured3d.Structured3DDataset
          split: test
          Structured3D_DIR: ./dataset/Structured3D/Structured3D
          len_test: 1400
        - _target_: data.datasets.panocity.PanoCityDataset
          split: test
          PanoCity_DIR: ./dataset/PanoCity
          len_test: 2400
        - _target_: data.datasets.matterport3d.Matterport3DDataset
          split: test
          Matterport3D_DIR: ./dataset/Matterport3D/processed
          len_test: 480
