# @package _global_
# Stage D — full feed-forward GS with SH rest + center offset.
# Backbone unfrozen at low LR.

defaults:
  - /default
  - _self_

exp_name: gs_stage_d

model:
  enable_global_points: True
  enable_gaussian: True
  gs_sh_degree: 1
  gs_scale_init: 0.01
  gs_opacity_init: 0.1

loss:
  _target_: panovggt.models.loss.Loss
  train_conf: ${model.train_conf}
  gs:
    enabled: True
    renderer: cube
    face_res: 512
    fov_deg: 95.0
    boundary_px: 4
    scale_init_mode: depth_footprint
    scale_init_value: 0.01
    use_offset: True
    detach_centers: False    # gradients flow into world_points head at D
    detach_camera: True
    train_dc: True
    train_opacity: True
    train_scale: True
    train_rotation: True
    train_sh_rest: True
    rgb_weight: 1.0
    ssim_weight: 0.2
    depth_weight: 0.05
    loss_weight: 1.0
    point_loss_weight: 1.0
    camera_loss_weight: 0.1


# ---- backbone unfrozen at low LR; head retains base LR ---------------------
optim:
  frozen_module_names: []
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-6
    weight_decay: 0.05
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["conf"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["camera"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["point"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["pos"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["gaussian_head"]
        max_norm: 1.0
        norm_type: 2

logging:
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_gs
        - loss_gs_rgb
        - loss_gs_ssim
        - loss_gs_depth
        - loss_camera
        - loss_local_point
        - loss_global_point
    val:
      keys_to_log:
        - loss_objective
        - loss_gs
        - loss_gs_rgb
        - loss_gs_ssim
        - loss_gs_depth
        - loss_camera
        - loss_local_point
        - loss_global_point
