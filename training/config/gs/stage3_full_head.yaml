# @package _global_
# Stage 3: optional low-LR full GS-head finetune.
# Use only after stage 2 plateaus and visual validation looks stable.

defaults:
  - /gs/local
  - _self_

exp_name: gs_stage3_full_head
max_epochs: 40
limit_train_batches: 300
limit_val_batches: 50

loss:
  gs:
    use_offset: True
    train_dc: True
    train_opacity: True
    train_scale: True
    train_rotation: True
    train_sh_rest: True

optim:
  frozen_module_names:
    - aggregator
    - point_decoder
    - point_head
    - camera_decoder
    - camera_head
    - global_points_decoder
    - global_point_head
    - pos_adapters
  optimizer:
    _target_: torch.optim.AdamW
    lr: 3e-7
    weight_decay: 0.0
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 3e-7
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.0

checkpoint:
  save_dir: ./outputs/${exp_name}/ckpts
  save_freq: 5
  resume_checkpoint_path: ./outputs/gs_stage2_refine/ckpts/checkpoint.pt
  strict: False

logging:
  log_dir: ./outputs/${exp_name}
  log_exp: ${exp_name}
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ./outputs/tensorboard/${exp_name}
