defaults:
  - gaussian_only
  - _self_

exp_name: panocity_partial_gaussian_v2_base
num_workers: 4
max_img_per_gpu: 48
max_img_per_gpu_val: 48
val_epoch_freq: 1

logging:
  log_dir: /home/featurize/PanoVGGT/outputs

checkpoint:
  save_dir: ${logging.log_dir}/${exp_name}/ckpts
  init_checkpoint_path: /home/featurize/PanoVGGT/checkpoints/model.pt
  save_freq: 1

loss:
  gaussian_render:
    weight: 2.0
    depth_weight: 0.10
    alpha_weight: 0.05
    opacity_floor: 1e-3
    sh_warmup_start: 0.0
    sh_warmup_end: 0.35
  gaussian_supervision:
    center_weight: 0.20
    scale_weight: 0.03
    rotation_weight: 0.02
    opacity_weight: 0.02
    keep_weight: 0.01
    split_weight: 0.01
    sh_weight: 0.03
    sh_rest_reg_weight: 0.002
    sh_rest_warmup_start: 0.0
    sh_rest_warmup_end: 0.35
    offset_reg_weight: 0.002

data:
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.panocity.PanoCityDataset
          split: train
          PanoCity_DIR: /home/featurize/PanoCity
          splits_config_file: /home/featurize/PanoVGGT/outputs/panocity_splits/splits_config.json
          cache_dir: /home/featurize/PanoVGGT/outputs/panocity_cache
          len_train: 4000
          get_nearby: True

  val:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu_val}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.panocity.PanoCityDataset
          split: test
          PanoCity_DIR: /home/featurize/PanoCity
          splits_config_file: /home/featurize/PanoVGGT/outputs/panocity_splits/splits_config.json
          cache_dir: /home/featurize/PanoVGGT/outputs/panocity_cache
          len_test: 256
